<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonsVPlay - Bingo</title>

    <link rel="stylesheet" href="bingo.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-bar">

        <button class="back-btn" onclick="window.location.href='home.html'">⬅</button>

        <h1>🎯 Bingo</h1>

        <div id="modeName">Pass & Play</div>

    </header>

    <!-- ================= PASS & PLAY ================= -->

    <div id="passPlayContainer">

        <!-- PLAYER 1 + TURN (UPSIDE DOWN) -->

        <div class="player1-area">

            <section class="player-section">

                <div class="player-header">

                    <h2>👤 Player 1</h2>

                    <div class="bingo-word" id="player1Word">
                        _ _ _ _ _
                    </div>

                </div>

                <div id="player1Board" class="board"></div>

            </section>

            <!-- TURN -->

            <div class="turn-box">

                <h3 id="turnText">
                    Player 1 Turn
                </h3>

            </div>

        </div>

        <!-- PLAYER 2 -->

        <section class="player-section">

            <div class="player-header">

                <h2>👤 Player 2</h2>

                <div class="bingo-word" id="player2Word">
                    _ _ _ _ _
                </div>

            </div>

            <div id="player2Board" class="board"></div>

        </section>

    </div>

    <!-- ================= SINGLE PLAYER ================= -->

    <div id="singleBoardContainer" style="display:none;">

        <div class="player-header">

            <h2 id="singleTitle">Player</h2>

            <div class="bingo-word" id="singleWord">
                _ _ _ _ _
            </div>

        </div>

        <div id="singleBoard" class="board"></div>

    </div>
    <!-- ================= GAME INFO ================= -->

    <div class="info-box">

        <p>

            Current Number :

            <span id="currentNumber">
                -
            </span>

        </p>

    </div>

    <!-- ================= WINNER POPUP ================= -->

    <div id="winnerPopup" class="winner-popup">

        <div class="winner-card">

            <h1 id="winnerTitle">
                🏆 Winner
            </h1>

            <p id="winnerMessage">

                Congratulations!

            </p>

            <button id="playAgainBtn">

                🔄 Play Again

            </button>

            <button onclick="location.href='home.html'">

                🏠 Home

            </button>

        </div>

    </div>

    <!-- ================= LOADING SCREEN ================= -->

    <div id="loadingScreen">

        <h2>

            🎮 Loading Bingo...

        </h2>

    </div>

    <!-- ================= SCRIPT ================= -->

    <script src="bingo.js"></script>

</body>
</html>
